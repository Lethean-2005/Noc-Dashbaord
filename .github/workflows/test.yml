name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Word automation and pywin32 target the Windows deployment environment.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.21

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest
