# Report metadata for the dashboard landing page.
# Not read by any code yet — app/repositories/dashboard_repository.py calls
# run_query() directly. This describes the intended shape for when report
# metadata (refresh interval, description) becomes data-driven instead of
# hardcoded in the repository.
#
#   name                     — unique report id
#   description              — shown in the reports UI
#   query                    — "<domain>.<name>" of the .sql query it runs
#   refresh_interval_minutes — how often the cached result should refresh

name: dashboard_overview
description: High level counts shown on the dashboard landing page.
query: dashboard.summary
refresh_interval_minutes: 5
