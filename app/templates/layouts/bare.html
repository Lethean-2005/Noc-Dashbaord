<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Noc-Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ versioned_static('css/tabler-icons.min.css') }}">
    <link rel="stylesheet" href="{{ versioned_static('css/theme.css') }}">
    <link rel="stylesheet" href="{{ versioned_static('css/app.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ versioned_static('images/favicon.svg') }}">
    <link rel="icon" href="{{ versioned_static('images/favicon.svg') }}">
    <script>
        // Apply the saved theme before first paint so there is no flash of light.
        (function () {
            try {
                if (localStorage.getItem('dash-theme') === 'dark')
                    document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>
    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
