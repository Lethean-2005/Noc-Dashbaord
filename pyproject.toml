[project]
name = "noc-dashboard"
version = "0.1.0"
description = "NOC dashboard, reporting, and mentor tracking application"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Login>=0.6",
    "Flask-WTF>=1.2",
    "Flask-Compress>=1.17",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pymssql>=2.3",
    "python-dotenv>=1.0",
    "colorama>=0.4",
    "requests>=2.32",
    "urllib3>=2.2,<2.3",
    "waitress>=3.0",
    "PySide6>=6.10",
    "tzdata>=2024.1",
    "Pillow>=11.0",
    "openpyxl>=3.1",
    "pywin32>=312",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "black>=24.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/manual/ holds scripts that send REAL Telegram alerts when run
# directly (see tests/manual/README.md) — must never be auto-collected.
norecursedirs = ["manual"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
