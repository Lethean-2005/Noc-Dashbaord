[project]
name = "noc-dashboard"
version = "19.3.8"
description = "NOC dashboard, reporting, and mentor tracking application"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.3",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Login>=0.6",
    "Flask-WTF>=1.2",
    "Flask-Compress>=1.17",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pymssql>=2.3",
    "python-dotenv>=1.2.2",
    "colorama>=0.4",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
    "waitress>=3.0",
    "PySide6>=6.10",
    "tzdata>=2024.1",
    "Pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "openpyxl>=3.1",
    "pywin32>=312",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "black>=24.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep any future manual alert senders out of automatic test collection.
norecursedirs = ["manual"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
